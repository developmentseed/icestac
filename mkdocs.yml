site_name: icestac
site_description: Manage STAC metadata in Apache Iceberg
site_url: https://developmentseed.github.io/icestac/
repo_url: https://github.com/developmentseed/icestac
repo_name: developmentseed/icestac

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
          paths: [src]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - API: api.md
