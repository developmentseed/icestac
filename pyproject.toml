[project]
name = "icestac"
version = "0.0.1"
description = "Manage STAC metadata in Apache Iceberg"
readme = "README.md"
authors = [
    { name = "hrodmn", email = "henry@developmentseed.org" }
]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=23.0.0",
    "pydantic-settings>=2.12.0",
    "pyiceberg[pyiceberg-core]>=0.10.0",
    "rustac[arrow]>=0.9.3",
    "stac-pydantic>=3.4.0",
]

[project.scripts]
icestac = "icestac:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
deploy = [
    "aws-cdk-lib>=2.236.0",
]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "sqlalchemy>=2.0.46",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:pydantic.*",
]
