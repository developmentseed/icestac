[project]
name = "icestac"
version = "0.1.0"
description = "Manage STAC metadata in Apache Iceberg"
readme = "README.md"
authors = [
    { name = "hrodmn", email = "henry@developmentseed.org" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=23.0.0",
    "pyiceberg[pyiceberg-core]>=0.12.0",
    "rustac[arrow]>=0.9.3",
]

[project.urls]
Documentation = "https://developmentseed.github.io/icestac/"
Repository = "https://github.com/developmentseed/icestac"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
deploy = [
    "aws-cdk-lib>=2.236.0",
]
dev = [
    "obstore>=0.9.4",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.46",
    "ty>=0.0.18",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--cov-config=pyproject.toml", 
    "--cov=src",
    "--cov-report=term-missing"
]
filterwarnings = [
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # formatter handles trailing commas
    "CPY001", # repository does not use file headers
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "FIX002", # todo statements
    "PYI051", # literal strings redundant with str in type union
    "TD002",  # todo without author name
    "TRY003", # define exceptions in the exception class
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["ASYNC240", "D100", "S101"]
"src/icestac/*.py" = ["D100", "FBT003", "PLW2901"]
"tests/*" = [
    "ANN001",  # annotation in function argument
    "ANN201",  # return type annotation
    "ANN202",  # private helper annotations in test patches
    "ARG001",  # unused arguments in test patch callbacks
    "B905",    # test fixture columns are intentionally paired
    "D",       # docstring
    "FBT001",  # boolean fixture parameter
    "PLR2004", # Magic value used in comparison
    "RUF043",  # pytest regex match strings
    "S101",    # assert
    "SLF001",  # private member access
    "UP035",   # compatibility with the existing fixture imports
    "PIE804",   # existing fixture kwargs are clear as written
]
