[project]
name = "icestac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hrodmn", email = "henry.rodman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=23.0.0",
    "pydantic-settings>=2.12.0",
    "pyiceberg[pyiceberg-core]>=0.10.0",
    "rustac[arrow]>=0.9.3",
    "stac-pydantic>=3.4.0",
]

[project.scripts]
icestac = "icestac:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
deploy = [
    "aws-cdk-lib>=2.236.0",
]
dev = [
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.46",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:pydantic.*",
]
