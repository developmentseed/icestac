name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  publish-to-pypi:
    name: Publish distribution
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing
    environment:
      name: pypi-release
      url: https://pypi.org/p/icestac
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          project_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$project_version" = "$expected_version" || {
            echo "Release tag $RELEASE_TAG does not match project version $project_version" >&2
            exit 1
          }

      - name: Build distribution
        run: uv build

      # Re-enable after PyPI trusted publishing is configured.
      - name: Publish distribution
        if: ${{ false }}
        run: uv publish
