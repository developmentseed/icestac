name: Test

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - develop
    tags:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.*" 
          enable-cache: true
    
      - name: Install dependencies
        run: |
          uv sync 

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest
